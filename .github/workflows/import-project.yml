name: Import CRAYON PLANET project

on:
  push:
    paths:
      - 'crayon-planet-nextjs(3).zip'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          if [ ! -f "crayon-planet-nextjs(3).zip" ]; then
            echo "ZIP file not found. Nothing to import."
            exit 0
          fi

          mkdir -p /tmp/crayon-project
          unzip -q "crayon-planet-nextjs(3).zip" -d /tmp/crayon-project

          PROJECT_DIR=$(find /tmp/crayon-project -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$PROJECT_DIR" ]; then
            cp -a "$PROJECT_DIR"/. .
          else
            cp -a /tmp/crayon-project/. .
          fi

          rm -f "crayon-planet-nextjs(3).zip"
          rm -rf /tmp/crayon-project

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CRAYON PLANET project" || exit 0
          git push
